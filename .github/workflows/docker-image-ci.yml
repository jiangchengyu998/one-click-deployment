name: Docker Image CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t "${{ github.repository }}" \
            .
