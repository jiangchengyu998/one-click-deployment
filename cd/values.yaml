route:
  gatewayName: traefik-gateway
  namespace: kube-system
  host: HOSTNAME
  path: /

fullnameOverride: APP-NAME
nameOverride: ""
namespace: default

replicaCount: 1

serviceAccount:
  create: false
  name: ""
  automountServiceAccountToken: true

rbac:
  logReader:
    enabled: false
    namespace: default

image:
  repository: 192.168.50.18:5000/APP-NAME
  tag: "TAG"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

envFromSecret: ENV_SECRET_NAME

env:
  - name: NODE_ENV
    value: production
  - name: PORT
    value: "3000"
  - name: APP_ENV
    value: ENVIRONMENT

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 256Mi

probe:
  enabled: true
  path: /
  initialDelaySeconds: 20
  periodSeconds: 10
  timeoutSeconds: 3

nodeSelector: {}
tolerations: []
affinity: {}
